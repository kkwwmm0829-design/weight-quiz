<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>무게를 맞춰봐!</title>
<style>
:root{
  --bg1:#a6a2d4; --bg2:#9b94ca; --deep:#2e2870; --band:#3b3380;
  --green:#1f8f6c; --green-d:#146b50; --text:#3a3470; --pan:#6e6cb6; --beam:#f4a65a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#1c1838;overflow:hidden;font-family:"Jua","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
#stage *{font-weight:400!important}
.btn,.home,.back,.title h1,.title .quiz,.brand,.qnum,.pick .pn,.tok .n,.chain .c .n,.stcard .num,.stcard .lv,.opt,.ordsel .os span,.card .ans .lab,.grp h5{font-family:"Jalnan","Jua","Malgun Gothic",sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;overflow:hidden;
  background:linear-gradient(90deg,var(--bg1) 0 50%,var(--bg2) 50% 100%);color:var(--text)}
.ring{position:absolute;border-radius:50%;border:70px solid rgba(255,255,255,.13);pointer-events:none}
.band{position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--band)}
.brand{position:absolute;right:34px;top:22px;text-align:right;line-height:1.05;z-index:5;pointer-events:none}
.brand b{display:block;color:#23a27a;font-size:26px;letter-spacing:.5px}
#stage.cover .brand b{font-size:40px;margin-top:14px}
#stage.cover .brand i{display:none}
.brand i{display:block;color:#fff;font-style:normal;font-size:24px;font-weight:900}
.home{position:absolute;left:-10px;bottom:16px;background:var(--band);color:#fff;font-size:20px;padding:12px 30px 12px 40px;border-radius:0 26px 0 0;cursor:pointer;z-index:60;border:0;font-family:inherit}
.screen{position:absolute;inset:0}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:40px;padding:14px 38px;font-size:28px;font-weight:600;font-family:inherit;cursor:pointer;
  background:var(--green);color:#fff;box-shadow:0 6px 0 var(--green-d);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--green-d)}
.btn.white{background:#fff;color:var(--green);box-shadow:0 6px 0 #c9c6e6}
.btn.sm{font-size:22px;padding:10px 26px}
.btn[disabled]{opacity:.45;pointer-events:none}
.qnum{position:absolute;left:40px;top:26px;color:#fff;font-size:32px;font-weight:600}
.qnum small{display:inline-block;background:var(--deep);color:#fff;font-size:20px;padding:4px 14px;border-radius:20px;margin-right:12px;vertical-align:middle}
.qtext{position:absolute;left:190px;right:190px;top:30px;text-align:center;font-size:38px;line-height:1.4;color:var(--text);font-weight:400;font-family:'Jua','Pretendard','Noto Sans KR','Malgun Gothic',sans-serif}
.qtext b{font-weight:400;color:#2e2870}
.qtext em{font-style:normal;color:#14805f;font-weight:400}
.qtext .sub{display:block;font-size:29px;color:#fff;margin-top:6px;font-weight:400}
.tip{position:absolute;left:0;right:0;text-align:center;font-size:21px;color:#fff}

/* tokens */
.tok{position:relative;display:inline-block;cursor:grab;touch-action:none}
.tok img{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 4px 3px rgba(40,30,90,.25))}
.tok .n{position:absolute;left:0;right:0;top:-38px;text-align:center;color:#fff;font-size:28px;font-weight:600}
.tok.sel{outline:5px solid #fff;outline-offset:4px;border-radius:50%;animation:pulse 1s infinite}
.tok.locked{cursor:default}
@keyframes pulse{50%{outline-color:#ffe36e}}
.sw{position:relative;display:inline-block;cursor:grab;touch-action:none}
.sw img{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(40,30,90,.25))}
.sw span{position:absolute;left:0;right:0;top:56%;transform:translateY(-50%);text-align:center;color:#555;font-weight:700;pointer-events:none}
.sw.sel{outline:5px solid #fff;outline-offset:4px;border-radius:12px;animation:pulse 1s infinite}
.empty{display:inline-block;border-radius:50%;border:4px dashed rgba(255,255,255,.75);background:rgba(255,255,255,.12)}
.qslot{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:3px dashed #5a55a0;background:rgba(255,255,255,.85);color:#5a55a0;font-size:30px;font-weight:700}
.ghost{position:fixed;pointer-events:none;z-index:9999;opacity:.9;transform:translate(-50%,-50%) scale(1.08)}
.ghost img{width:100%;height:100%}
.ghost span{position:absolute;left:0;right:0;top:56%;transform:translateY(-50%);text-align:center;color:#555;font-weight:700}

/* tray */
.tray{position:absolute;display:flex;justify-content:center;align-items:flex-end;gap:34px}
.tray .slot{display:flex;flex-direction:column;align-items:center}
.droptray{border-radius:30px}
.droptray.over,.pan.over .dish,.grp.over{box-shadow:0 0 0 6px #ffe36e}

/* scale */
.scale{position:absolute}
.scale .stand{position:absolute;left:0;top:0;overflow:visible}
.scale .beam{position:absolute;height:16px;border-radius:8px;background:linear-gradient(#f8bb78,#ee9a4c);transition:transform .9s cubic-bezier(.4,1.6,.5,1);transform-origin:50% 50%;z-index:2}
.scale .pivot{position:absolute;width:30px;height:30px;border-radius:50%;background:#5752a3;border:5px solid #b6b3e6;z-index:3}
.scale .pan{position:absolute;left:0;top:0;transition:transform .9s cubic-bezier(.4,1.6,.5,1);z-index:4}
.scale .pan svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.scale .dish{position:absolute;left:0;border-radius:6px 6px 120px 120px/6px 6px 46px 46px;background:linear-gradient(#7c7ac2 0 18%,#6b68b3 18% 100%)}
.scale .items{position:absolute;left:-40px;right:-40px;display:flex;justify-content:center;align-items:flex-end;z-index:5}
.scale .items>*{margin:0 -14px}
.scale .lock{position:absolute;z-index:6;background:#fff;color:var(--deep);font-size:18px;padding:6px 14px;border-radius:16px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.15)}

.panel{position:absolute;background:rgba(255,255,255,.18);border-radius:26px;padding:22px 26px}
.panel h4{margin:0 0 10px;color:#fff;font-size:24px;font-weight:600}
.log{display:flex;flex-wrap:wrap;gap:10px;min-height:46px}
.log span{background:#fff;color:var(--deep);border-radius:22px;padding:6px 16px;font-size:22px;font-weight:700}
.count{font-size:24px;color:#fff;margin-bottom:12px}
.count b{font-size:34px;color:#fff59a}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.opt{background:#fff;border:0;border-radius:40px;padding:12px 10px;font-size:28px;font-family:inherit;color:var(--green);font-weight:600;cursor:pointer;box-shadow:0 5px 0 #c9c6e6}
.opt b{color:var(--text);margin-right:6px}
.opt:active{transform:translateY(3px)}
.msg{position:absolute;text-align:center;font-size:25px;color:#fff;background:rgba(46,40,112,.55);border-radius:20px;padding:14px 20px;line-height:1.4}
.msg.good{background:#1f8f6c}
.navr{position:absolute;right:34px;bottom:40px;display:flex;gap:16px;z-index:10}

/* chain */
.chain{position:absolute;display:flex;align-items:center;justify-content:center;gap:6px}
.chain .c{display:flex;flex-direction:column;align-items:center;transition:opacity .4s}
.chain .c .n{color:#fff;font-size:22px;font-weight:600;height:28px}
.chain .arr{display:flex;flex-direction:column;align-items:center;color:#fff;font-weight:700;min-width:70px}
.chain .arr i{font-style:normal;font-size:30px;line-height:1}
.chain .arr b{font-size:22px;background:rgba(46,40,112,.6);border-radius:12px;padding:2px 8px}
.chain .arr.found b{background:#1f8f6c}
.chain .cur{outline:4px dashed #fff59a;outline-offset:6px;border-radius:50%}

/* groups */
.grp{position:absolute;width:400px;height:250px;border-radius:30px;background:rgba(255,255,255,.2);border:4px dashed rgba(255,255,255,.8);display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.grp h5{margin:14px 0 6px;color:#fff;font-size:26px}
.grp .in{display:flex;gap:30px;align-items:center;height:150px}

/* overlay */
.ov{position:absolute;inset:0;background:rgba(40,34,100,.55);z-index:50;display:flex;align-items:center;justify-content:center}
.card{position:relative;background:var(--bg1);border-radius:36px;width:1180px;min-height:520px;padding:40px 50px 110px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.card .x{font-size:190px;line-height:1;color:#fff;font-weight:300}
.card .box{display:inline-block;background:#fff;border:3px dashed var(--green);border-radius:26px;padding:20px 46px;font-size:34px;color:var(--text);margin:10px 0}
.card .big{font-size:46px;color:var(--green);font-weight:700}
.card .ans{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0;font-size:40px;color:#fff;font-weight:700}
.card .ans img{width:92px;height:92px}
.card .ans .lab{display:flex;flex-direction:column;align-items:center;font-size:22px}
.card .expl{text-align:left;background:rgba(255,255,255,.92);border-radius:22px;padding:20px 28px;font-size:23px;line-height:1.7;color:var(--text);margin-top:14px;max-height:330px;overflow:auto}
.card .expl img.ii{width:38px;height:38px;vertical-align:middle;margin:0 2px}
.card .cbtns{position:absolute;right:40px;bottom:30px;display:flex;gap:16px}
.clap{position:absolute;width:170px;z-index:60;pointer-events:none;animation:clap .5s ease-in-out infinite alternate}
@keyframes clap{to{transform:translateY(-14px) rotate(-6deg)}}
img.ii{width:36px;height:36px;vertical-align:middle}

/* title */
.title h1{position:absolute;left:0;right:0;top:92px;margin:0;text-align:center;font-size:176px;line-height:1.1;color:var(--deep);letter-spacing:-2px}
.title h1 span{font-size:112px;color:#fff;letter-spacing:0;margin-left:14px}
.title .quiz{position:absolute;left:62px;top:44px;font-size:76px;color:var(--deep)}
.blob{position:absolute;pointer-events:none}
.dotd{position:absolute;border-radius:50%;background:#fff;pointer-events:none}
.iscale{position:absolute}
.iscale>img,.iscale .hang>img{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.iscale .beamimg{transition:transform 1s cubic-bezier(.4,1.5,.5,1)}
.iscale .hang{position:absolute;transition:transform 1s cubic-bezier(.4,1.5,.5,1)}
.iscale .items{position:absolute;display:flex;justify-content:center;align-items:flex-end;gap:0}
.cover-btn{font-size:60px!important;padding:16px 74px!important;border-radius:70px!important;box-shadow:0 12px 0 var(--green-d)!important}

/* stage select */
.stcard{position:absolute;top:365px;width:330px;height:370px;border-radius:44px;background:rgba(255,255,255,.22);border:4px solid rgba(255,255,255,.55);text-align:center;cursor:pointer;transition:transform .15s,background .15s;box-shadow:0 14px 0 rgba(46,40,112,.25)}
.stcard:hover{transform:translateY(-8px);background:rgba(255,255,255,.32)}
.stcard:active{transform:translateY(4px);box-shadow:0 6px 0 rgba(46,40,112,.25)}
.stcard .num{width:160px;height:160px;margin:50px auto 0;border-radius:50%;background:var(--green);box-shadow:0 9px 0 var(--green-d);color:#fff;font-size:100px;line-height:166px}
.stcard .lv{margin-top:34px;color:#fff;font-size:54px;letter-spacing:2px}
.selw{position:absolute;left:0;right:0;top:232px;display:flex;justify-content:center;gap:26px}
.selw img{width:92px;height:92px;filter:drop-shadow(0 6px 4px rgba(40,30,90,.25))}
.stcard .imgs{display:flex;justify-content:center;gap:4px;margin-top:22px}
.stcard .imgs img{width:58px}
.stcard .ok{position:absolute;right:-14px;top:-14px;width:70px;height:70px;border-radius:50%;background:#fff59a;color:var(--green);font-size:42px;font-weight:900;line-height:70px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.back{position:absolute;left:150px;bottom:16px;background:#5a52a8;color:#fff;font-size:20px;padding:12px 28px;border-radius:26px 26px 0 0;cursor:pointer;z-index:60;border:0;font-family:inherit}
.pick{display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .15s}
.pick .pn{color:#fff;font-size:44px;font-weight:700;margin-bottom:14px}
.pick img{width:250px;height:250px;filter:drop-shadow(0 12px 8px rgba(40,30,90,.3))}
.pick:hover{transform:translateY(-10px) scale(1.03)}
.pick.pressed{transform:scale(.94)}
#sProb.low .qnum{top:50px;left:60px;font-size:46px}
#sProb.low .qnum small{font-size:22px}
#sProb.low .qtext{top:128px;left:120px;right:120px;font-size:44px;line-height:1.45}
#sProb.low .qtext .sub{font-size:44px;color:var(--text);margin-top:0}
#sProb.low .qtext .sub b{color:#14805f}
#sProb.p11 .qtext{top:385px}
.scaleimg{position:absolute;pointer-events:none;filter:drop-shadow(0 10px 6px rgba(40,30,90,.18))}
.ordsel{position:absolute;display:flex;align-items:center;justify-content:center;gap:14px}
.ordsel .os{width:120px;height:150px;border-radius:24px;border:4px dashed rgba(255,255,255,.85);background:rgba(255,255,255,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:700}
.ordsel .os img{width:84px;height:84px}
.ordsel .gt{color:#fff;font-size:44px;font-weight:700}
.pick.used{opacity:.35;pointer-events:none}
.olabel{position:absolute;text-align:center;color:#fff;font-size:28px;font-family:'Jua','Malgun Gothic',sans-serif}
#certCard{position:absolute;left:230px;top:40px;width:1140px;height:720px;background:#fff;border-radius:36px;overflow:hidden;box-shadow:0 16px 0 rgba(46,40,112,.25);text-align:center;color:var(--text)}
#certCard .cbar{position:absolute;inset:0;border:22px solid var(--bg2);border-radius:36px;pointer-events:none}
#certCard .ctop{margin-top:56px;font-family:"Jalnan","Jua",sans-serif;color:#23a27a;font-size:30px;letter-spacing:1px}
#certCard .ctitle{font-family:"Jalnan","Jua",sans-serif;font-size:120px;color:var(--deep);line-height:1.15;margin-top:6px}
#certCard .ctitle em{font-style:normal;color:var(--green)}
#certCard .csub{font-family:"Jalnan","Jua",sans-serif;font-size:40px;color:#7b74c4;margin-top:-4px}
#certCard .cmsg{font-size:34px;line-height:1.5;margin-top:22px}
#cScale{position:absolute;left:390px;top:452px;width:360px;height:245px}
#certCard .cclap{position:absolute;width:190px;bottom:40px}
#cc1{left:60px} #cc2{right:60px}
#certCard .cdate{position:absolute;right:60px;top:52px;font-size:26px;color:#8a84b8}
.donebtns{position:absolute;left:0;right:0;top:790px;display:flex;justify-content:center;gap:30px}
@media print{
  @page{size:A4 landscape;margin:0}
  html,body{background:#fff!important;width:100%;height:100%}
  body *{visibility:hidden}
  #stage{transform:none!important;left:0!important;top:0!important;width:100%!important;height:100%!important;background:#fff!important}
  #stage>*:not(#sDone){display:none!important}
  .donebtns{display:none!important}
  #certCard,#certCard *{visibility:visible}
  #certCard{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #certCard *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.iscale .items>*{margin:0 -10px}
.iscale .lock{position:absolute;z-index:6;background:#fff;color:var(--deep);font-size:18px;padding:6px 14px;border-radius:16px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.iscale .hang.over{filter:drop-shadow(0 0 10px #fff59a)}
.iscale .tok .n{top:-34px}
.pscale .pzone{position:absolute}
.pscale .pitems{position:absolute;left:14px;right:14px;bottom:0;display:flex;flex-wrap:wrap-reverse;justify-content:center;align-content:flex-start;gap:0}
.pscale .pitems>*{margin:0 -4px -14px}
</style>
</head>
<body>
<div id="stage">
  <div class="ring" style="width:360px;height:360px;left:1300px;top:-90px"></div>
  <div class="ring" style="width:420px;height:420px;left:-150px;top:560px"></div>
  <div class="ring" style="width:180px;height:180px;left:130px;top:70px;border-width:40px"></div>
  <div class="band"></div>
  <div class="brand" id="brand"><b>FEEL THE MATH</b><i>무게를 맞춰봐!</i></div>

  <!-- title -->
  <div class="screen title" id="sTitle">
    <div class="quiz">Quiz</div>
    <h1>무게<span>를 맞춰봐!</span></h1>
    <div id="titleScale"></div>
    <div style="position:absolute;left:0;right:0;top:330px;text-align:center"><button class="btn cover-btn" onclick="go('select')">시작하기</button></div>
  </div>

  <!-- stage select -->
  <div class="screen hidden" id="sSelect">
    <div style="position:absolute;left:0;right:0;top:70px;text-align:center;font-size:64px;font-weight:900;color:var(--deep)">단계를 선택하세요</div>
    <div style="position:absolute;left:0;right:0;top:170px;text-align:center;font-size:30px;color:#fff">모양과 크기는 같지만 무게가 모두 다른 추들이 있어요. 양팔 저울로 무게를 맞춰 볼까요?</div>
    <div id="stCards"></div>
  </div>

  <!-- problem -->
  <div class="screen hidden" id="sProb"></div>

  <!-- 단계 성공 (인쇄) -->
  <div class="screen hidden" id="sDone">
    <div id="certCard">
      <div class="cbar"></div>
      <div class="ctop">FEEL THE MATH</div>
      <div class="ctitle"><span id="cStage">1단계</span> <em>성공!</em></div>
      <div class="csub">무게를 맞춰봐!</div>
      <div class="cmsg" id="cMsg"></div>
      <div id="cScale"></div>
      <img class="cclap" id="cc1" alt=""><img class="cclap" id="cc2" alt="">
      <div class="cdate" id="cDate"></div>
    </div>
    <div class="donebtns"><button class="btn" onclick="printCert()">🖨 인쇄하기</button><button class="btn white" onclick="go('select')">단계 선택으로</button></div>
  </div>

  <!-- end -->
  <div class="screen hidden title" id="sEnd">
    <div class="quiz">Quiz</div>
    <h1>무게<span>를 맞춰봐!</span></h1>
    <div id="endScale"></div>
    <div style="position:absolute;left:0;right:0;top:330px;text-align:center"><button class="btn cover-btn" style="padding:16px 110px!important" onclick="go('title')">끝</button></div>
  </div>

  <button class="home" onclick="go('title')">처음으로</button>
  <button class="back hidden" id="backBtn" onclick="goBack()">◀ 이전으로</button>
  <div id="ovRoot"></div>

let selected=null;   // {payload, el}
let dropHandler=null;
function clearSel(){ if(selected){ selected.el.classList.remove('sel'); selected=null; } }
function draggable(e, payload){
  e.addEventListener('pointerdown', ev=>{
    ev.preventDefault(); ev.stopPropagation();
    const r=e.getBoundingClientRect(); const sx=ev.clientX, sy=ev.clientY;
    let ghost=null, over=null;
    const move=m=>{
      if(!ghost && Math.hypot(m.clientX-sx,m.clientY-sy)>10){
        clearSel();
        ghost=e.cloneNode(true); ghost.className='ghost'; ghost.style.width=r.width+'px'; ghost.style.height=r.height+'px';
        ghost.querySelectorAll('.n').forEach(n=>n.remove());
        document.body.appendChild(ghost); e.style.opacity=.35;
      }
      if(ghost){
        ghost.style.left=m.clientX+'px'; ghost.style.top=m.clientY+'px';
        const t=document.elementFromPoint(m.clientX,m.clientY); const d=t&&t.closest('[data-drop]');
        if(over&&over!==d) over.classList.remove('over');
        if(d){ d.classList.add('over'); } over=d;
      }
    };
    const up=u=>{
      removeEventListener('pointermove',move); removeEventListener('pointerup',up); removeEventListener('pointercancel',up);
      if(over) over.classList.remove('over');
      if(ghost){
        ghost.remove(); e.style.opacity='';
        const t=document.elementFromPoint(u.clientX,u.clientY); const d=t&&t.closest('[data-drop]');
        if(d && dropHandler) dropHandler(payload, d.dataset.drop);
        else if(payload.from && payload.from!=='tray' && dropHandler) dropHandler(payload,'tray');
      } else {
        // 탭: 접시 위의 추를 누르면 되돌리기, 트레이의 추를 누르면 선택
        if(payload.from && payload.from!=='tray'){ clearSel(); dropHandler && dropHandler(payload,'tray'); }
        else if(selected && selected.el===e){ clearSel(); }
        else { clearSel(); selected={payload, el:e}; e.classList.add('sel'); }
      }
    };
    addEventListener('pointermove',move); addEventListener('pointerup',up); addEventListener('pointercancel',up);
  });
}
function dropTarget(e, key){
  e.dataset.drop=key;
  e.addEventListener('pointerup', ev=>{
    if(selected && !ev.target.closest('.tok,.sw')){ const p=selected.payload; clearSel(); dropHandler && dropHandler(p,key); }
  });
}

class Scale{
  constructor(parent, o){
    Object.assign(this,{w:640,h:440,half:230,str:150,panW:210,py:70,x:0,y:0},o);
    const root=this.root=el('div','scale'); root.style.cssText=`left:${this.x}px;top:${this.y}px;width:${this.w}px;height:${this.h}px`;
    const cx=this.cx=this.w/2;
    root.innerHTML=`<svg class="stand" width="${this.w}" height="${this.h}">
      <path d="M${cx-9} ${this.py-40} L${cx+9} ${this.py-40} L${cx+13} ${this.h-46} L${cx-13} ${this.h-46}Z" fill="#f4a65a"/>
      <path d="M${cx} ${this.py-62} L${cx+7} ${this.py-36} L${cx-7} ${this.py-36}Z" fill="#f4a65a"/>
      <rect x="${cx-46}" y="${this.h-56}" width="92" height="22" rx="10" fill="#f3a95f"/>
      <rect x="${cx-86}" y="${this.h-36}" width="172" height="34" rx="14" fill="#f4a65a"/></svg>`;
    this.beam=el('div','beam'); this.beam.style.cssText=`left:${cx-this.half-14}px;top:${this.py-8}px;width:${2*this.half+28}px`;
    const pv=el('div','pivot'); pv.style.cssText=`left:${cx-15}px;top:${this.py-15}px`;
    root.append(this.beam,pv);
    this.pans={};
    for(const s of ['L','R']){
      const p=el('div','pan'); const H=this.str+60;
      p.style.width=this.panW+'px'; p.style.height=H+'px';
      p.innerHTML=`<svg width="${this.panW}" height="${H}"><path d="M${this.panW/2} 0 L14 ${this.str+2} M${this.panW/2} 0 L${this.panW-14} ${this.str+2}" stroke="#4f57a8" stroke-width="3" fill="none"/></svg>`;
      const dish=el('div','dish'); dish.style.cssText=`top:${this.str}px;width:${this.panW}px;height:46px`;
      const items=el('div','items'); items.style.cssText=`bottom:${H-this.str-8}px`;
      p.append(dish,items); root.append(p);
      this.pans[s]={el:p,items};
    }
    parent.append(root); this.set(0,true);
  }
  set(deg,instant){
    const r=deg*Math.PI/180, c=Math.cos(r), s=Math.sin(r);
    if(instant){ this.beam.style.transition='none'; Object.values(this.pans).forEach(p=>p.el.style.transition='none'); }
    this.beam.style.transform=`rotate(${deg}deg)`;
    const Lx=this.cx-this.half*c, Ly=this.py-this.half*s, Rx=this.cx+this.half*c, Ry=this.py+this.half*s;
    this.pans.L.el.style.transform=`translate(${Lx-this.panW/2}px,${Ly}px)`;
    this.pans.R.el.style.transform=`translate(${Rx-this.panW/2}px,${Ry}px)`;
    if(instant){ this.root.offsetWidth; this.beam.style.transition=''; Object.values(this.pans).forEach(p=>p.el.style.transition=''); }
  }
  setDiff(d){ this.set(d===0?0:Math.sign(d)*Math.min(15,5+Math.abs(d)*.42)); }   // d = 오른쪽 - 왼쪽
  fill(side, nodes){ const it=this.pans[side].items; it.innerHTML=''; nodes.forEach(n=>it.append(n)); }
}

/* ---------- 정답/오답 창 ---------- */
function closeOv(){ document.getElementById('ovRoot').innerHTML=''; }
function overlay(html, buttons, claps){
  closeOv();
  const ov=el('div','ov'); const c=el('div','card',html); ov.append(c);
  const b=el('div','cbtns'); buttons.forEach(x=>b.append(x)); c.append(b);
  if(claps){
    [['clap3',-40,620],['clap2',70,700],['clap1',1390,640],['clap4',1460,560]].forEach(([k,x,y],i)=>{
      const im=el('img','clap'); im.src=IMG(k); im.style.left=x+'px'; im.style.top=y+'px'; im.style.animationDelay=(i*.12)+'s'; ov.append(im);
    });
  }
  document.getElementById('ovRoot').append(ov);
}
function B(label, cls, fn){ const b=el('button','btn '+(cls||''),label); b.onclick=fn; return b; }
function answerHTML(p){
  const chainImg=(ids,sep,nums)=>ids.map((id,i)=>`<span class="lab">${nums?nums[i]:''}<img src="${IMG('w_'+id)}"></span>`).join(`<span>${sep}</span>`);
  const byNum = Object.fromEntries((p.items||[]).map(([n,id])=>[n,id]));
  switch(p.type){
    case 'heavier': return `<div class="box">더 무거운 추는 <span class="big">${p.answer}번</span> 입니다</div><div class="ans"><img src="${IMG('w_'+byNum[p.answer])}" style="width:190px;height:190px"></div>`;
    case 'order': { const ns=p.answer.split('>'); return `<div class="box">정답은 <span class="big">${ns.join('-')}</span> 입니다</div><div class="ans">${chainImg(ns.map(n=>byNum[n]),'›',ns)}</div>`; }
    case 'steps': return `<div class="box">정답은 <span class="big">1&lt;5&lt;2&lt;3&lt;6&lt;4</span><br>순서로 10g씩 차이가 나면서 무거워집니다</div><div class="ans">${chainImg(ORDER,'<small style="font-size:22px">+10g</small>',ORDER.map(k=>N2[k]))}</div>`;
    case 'pairs': return `<div class="box">정답은 <span class="big">1+4 = 5+6 = 2+3</span> 입니다</div><div class="ans">${chainImg(['poke','bat'],'+',[1,4])}<span>=</span>${chainImg(['iron','spider'],'+',[5,6])}<span>=</span>${chainImg(['super','cap'],'+',[2,3])}</div>`;
    case 'balance':
      if(p.id==='2-4') return `<div class="box">정답은 <span class="big">4, 5</span> 혹은 <span class="big">2, 6</span> 추를 놓으면 균형이 맞습니다</div><div class="ans">${chainImg(['bat','iron'],'+',[4,5])}<span style="margin:0 30px">또는</span>${chainImg(['super','spider'],'+',[2,6])}</div>`;
      const sol={'3-1':[['super','bat','s10','poke'],['cap','iron','spider']],'3-2':[['cap','poke','bat'],['super','s10','iron','spider']],'3-3':[['bat','iron','super'],['poke','s10','cap','spider']]}[p.id];
      const side=ids=>ids.map(id=>isSmall(id)?`<span class="lab"><span style="background:#eee;color:#555;border-radius:10px;padding:16px 12px;font-size:26px">10g</span></span>`:`<img src="${IMG('w_'+id)}">`).join('');
      return `<div class="box">정답은 아래 그림을 확인하세요!</div><div class="ans"><span style="font-size:26px">왼쪽</span>${side(sol[0])}<span style="margin:0 20px">=</span>${side(sol[1])}<span style="font-size:26px">오른쪽</span></div>`+(p.id==='3-2'?'<div style="color:#fff;font-size:22px">(양쪽을 서로 바꾸어 놓아도 정답이에요)</div>':'');
  }
}
function success(p, msg){
  done[p.id]=true; play('right');
  let showEx=false;
  const html=`<div><div class="box" style="font-size:44px;color:var(--green);font-weight:700;padding:14px 50px">축하합니다 정답입니다!</div></div>${msg?`<div style="color:#fff;font-size:26px;margin-top:8px">${msg}</div>`:''}${answerHTML(p)}<div class="expl hidden" id="exBox">${p.expl}</div>`;
  overlay(html,[ B('풀이보기','',e=>{ if(p.anim){ closeOv(); p.anim(); return; }showEx=!showEx; document.getElementById('exBox').classList.toggle('hidden',!showEx); e.target.textContent=showEx?'풀이닫기':'풀이보기';}), B('다음문제 ▶','white',next) ], true);
}
function wrong(p, msg, retry){
  play('wrong');
  overlay(`<div class="x">X</div><div class="box">오답입니다.<br>다시 한번 생각해 보세요.</div>${msg?`<div style="color:#fff;font-size:27px;margin-top:14px">${msg}</div>`:''}`,
    p.stage===1 ? [ B('다시풀기','',()=>{ closeOv(); retry&&retry(); }) ] : [ B('다시풀기','',closeOv), B('정답보기','white',()=>showAnswer(p,true)) ]);
}
function showAnswer(p){
  overlay(`<div style="text-align:left;color:#fff;font-size:30px;margin-top:-10px">정답</div>${answerHTML(p)}<div class="expl">${p.expl}</div>`,
    [ B('문제다시보기','',closeOv), B('다음문제 ▶','white',next) ]);
}

/* ---------- 유형 0: 더 무거운 추 고르기 (실물 저울 사용, 추를 눌러 답하기) ---------- */
function rPick(p){
  const root=frame(p);
  // 저울1(수평) 그림, 풀이 때 저울4(기울어진) 그림으로 바뀜
  const SW=450, k=SW/867, k4=k*48/45, ox=433*k-413.5*k4, oy=189*k-184.5*k4;
  const box=el('div','iscale'); box.style.cssText=`left:575px;top:560px;width:${SW}px;height:${406*k}px`;
  const lv=el('img'); lv.src=IMG('s1_full'); lv.style.cssText='position:absolute;left:0;top:0;width:100%;transition:opacity .6s';
  const tl=el('img'); tl.src=IMG('s4'); tl.style.cssText=`position:absolute;left:${ox}px;top:${oy}px;width:${841*k4}px;opacity:0;transition:opacity .6s`;
  box.append(lv,tl); root.append(box);
  const PAN={L:[120*k,333*k], R:[747*k,333*k]};
  const PAN4={L:[ox+113*k4,oy+300*k4], R:[ox+724*k4,oy+380*k4]};
  const row=el('div'); row.style.cssText='position:absolute;left:0;right:0;top:108px;display:flex;justify-content:center;gap:120px';
  const W8={};
  p.items.forEach(([n,id])=>{
    const w=el('div','pick');
    w.innerHTML=`<div class="pn">${n}</div><img src="${IMG('w_'+id)}" alt="${n}번 추" style="width:190px;height:190px">`;
    w.onclick=()=>{ if(root.dataset.anim) return; w.classList.add('pressed'); setTimeout(()=>w.classList.remove('pressed'),200); n===p.answer?success(p):wrong(p); };
    row.append(w); W8[n]={el:w,id};
  });
  root.append(row);
  navButtons(root,p,[]);
  // 풀이: 추가 저울로 올라가고, 무거운 쪽으로 기울어짐
  p.anim=()=>{
    root.dataset.anim='1';
    const stage=document.getElementById('stage').getBoundingClientRect(), f=stage.width/1600;
    const SZ=60, sides=['L','R'], flies=[];
    const [a,b]=p.items; const heavyR=W[b[1]]>W[a[1]];
    p.items.forEach(([n,id],i)=>{
      const img=W8[n].el.querySelector('img'), r=img.getBoundingClientRect();
      const fx=(r.left-stage.left)/f, fy=(r.top-stage.top)/f, fw=r.width/f;
      const [px,py]=PAN[sides[i]];
      const fly=el('img'); fly.src=img.src; fly.style.cssText=`position:absolute;z-index:30;left:${fx}px;top:${fy}px;width:${fw}px;height:${fw}px;transition:all 1s cubic-bezier(.5,0,.3,1) ${i*.5}s;filter:drop-shadow(0 6px 4px rgba(40,30,90,.3))`;
      root.append(fly); img.style.visibility='hidden'; flies.push(fly);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ fly.style.left=(575+px-SZ/2)+'px'; fly.style.top=(560+py-SZ)+'px'; fly.style.width=fly.style.height=SZ+'px'; }));
    });
    setTimeout(()=>{
      // 기울어진 저울로 바뀌며 추도 함께 이동
      lv.style.opacity=0; tl.style.opacity=1;
      flies.forEach((fly,i)=>{ const pos=heavyR?PAN4:{L:PAN4.R,R:PAN4.L}; const [px,py]=pos[sides[i]];
        fly.style.transition='all .6s ease-in-out'; fly.style.left=(575+px-SZ/2)+'px'; fly.style.top=(560+py-SZ)+'px'; });
    }, 2200);
    setTimeout(()=>{
      const again=B('↺ 다시 보기','white sm',()=>{ openProb(cur); setTimeout(()=>P[cur].anim(),300); });
      const bb=el('div'); bb.style.cssText='position:absolute;left:350px;top:828px;z-index:9'; bb.append(again); root.append(bb);
    },3000);
  };
}

/* ---------- 1단계 순서 문제: 무거운 순서대로 추를 눌러 답하기 ---------- */
function rTapOrder(p){
  const root=frame(p);
  const k=p.items.length, sel=[];
  const sc=el('img','scaleimg'); sc.src=IMG('s1_full'); sc.style.cssText='left:70px;top:420px;width:600px'; root.append(sc);
  const lab=el('div','olabel','추를 무거운 순서대로 눌러 보세요'); lab.style.cssText+=';left:720px;width:820px;top:282px'; root.append(lab);
  const size=k>3?150:170, gap=k>3?40:60;
  const row=el('div'); row.style.cssText=`position:absolute;left:720px;width:820px;top:322px;display:flex;justify-content:center;gap:${gap}px`;
  const picks={};
  p.items.forEach(([n,id])=>{
    const w=el('div','pick'); w.innerHTML=`<div class="pn" style="font-size:36px;margin-bottom:6px">${n}</div><img src="${IMG('w_'+id)}" alt="${n}번 추" style="width:${size}px;height:${size}px">`;
    w.onclick=()=>{ if(sel.length>=k) return; sel.push(n); draw(); if(sel.length===k) setTimeout(check,350); };
    picks[n]=w; row.append(w);
  });
  root.append(row);
  const ord=el('div','ordsel'); ord.style.cssText='left:720px;width:820px;top:585px'; root.append(ord);
  const hl=el('div','olabel','<span style="font-size:24px">무거운 추</span>'); hl.style.cssText+=';left:720px;width:820px;top:720px;text-align:left;padding-left:'+(k>3?40:110)+'px'; 
  const clear=B('↺ 지우기','white sm',()=>{ sel.length=0; draw(); });
  const bb=el('div'); bb.style.cssText='position:absolute;left:350px;top:828px;display:flex;gap:16px;z-index:9'; bb.append(clear); root.append(bb);
  if(p.tip){ const t=el('div','tip',p.tip); t.style.cssText='left:520px;right:420px;top:836px;font-size:19px'; root.append(t); }
  navButtons(root,p,[]);
  function draw(){
    ord.innerHTML='';
    for(let i=0;i<k;i++){
      if(i>0) ord.append(el('div','gt','&gt;'));
      const n=sel[i], box=el('div','os');
      if(n!=null){ const id=p.items.find(x=>x[0]===n)[1]; box.innerHTML=`<img src="${IMG('w_'+id)}"><span>${n}</span>`; box.style.background='rgba(255,255,255,.35)'; box.style.borderStyle='solid'; }
      ord.append(box);
    }
    Object.entries(picks).forEach(([n,w])=>w.classList.toggle('used',sel.includes(+n)));
  }
  function check(){ sel.join('>')===p.answer ? success(p) : wrong(p,'',()=>{ sel.length=0; draw(); }); }
  draw();
}

/* ---------- 유형 1: 순서 찾기 ---------- */
function rOrder(p){
  const root=frame(p);
  const st={pan:{L:null,R:null}, count:0, log:[], last:''};
  const tray=el('div','tray droptray'); tray.style.cssText='left:60px;right:60px;top:196px;height:150px'; dropTarget(tray,'tray'); root.append(tray);
  const sc=p.stage===2? new ImgScale(root,{x:100,y:440,w:660,cfg:S1}) : new Scale(root,{x:80,y:345,w:700,h:470,half:250,str:160,panW:220});
  dropTarget(sc.pans.L.el,'L'); dropTarget(sc.pans.R.el,'R');
  const panel=el('div','panel'); panel.style.cssText='left:830px;top:370px;width:720px';
  panel.innerHTML=`<div class="count">저울 사용 횟수 : <b id="cnt">0</b>번</div><h4>비교 기록</h4><div class="log" id="log"><span style="background:transparent;color:#fff;font-weight:400;font-size:20px;padding:6px 0">추를 끌어서(또는 눌러서) 저울 접시에 올려 보세요.</span></div>`;
  root.append(panel);
  const ap=el('div','panel'); ap.style.cssText='left:830px;top:590px;width:720px';
  if(p.type==='heavier'){
    ap.innerHTML='<h4>더 무거운 추를 골라 보세요</h4>';
    const row=el('div'); row.style.cssText='display:flex;gap:30px;justify-content:center';
    p.items.forEach(([n,id])=>{ const b=el('button','opt',`<b>${n}번</b><img src="${IMG('w_'+id)}" style="width:56px;vertical-align:middle">`); b.style.width='240px'; b.onclick=()=> n===p.answer?success(p):wrong(p); row.append(b); });
    ap.append(row);
  } else {
    ap.innerHTML='<h4>무거운 순서대로 나열한 것을 골라 보세요</h4>';
    const g=el('div','opts');
    p.options.forEach((o,i)=>{ const b=el('button','opt',`<b>${i+1}.</b> ${o}`); b.onclick=()=> o===p.answer?success(p):wrong(p); g.append(b); });
    ap.append(g);
  }
  root.append(ap);
  if(p.tip){ const t=el('div','tip',p.tip); t.style.cssText='left:560px;right:420px;top:836px;font-size:19px'; root.append(t); }
  const reset=el('button','btn white sm','↺ 다시 하기'); reset.onclick=()=>rOrder(p);
  navButtons(root,p,[]);
  const rb=el('div'); rb.style.cssText='position:absolute;left:350px;top:828px;z-index:9'; rb.append(reset); root.append(rb);
  const big = p.items.length>4?118:130;
  function render(){
    tray.innerHTML='';
    p.items.forEach(([n,id])=>{
      const slot=el('div','slot');
      if(st.pan.L===n||st.pan.R===n){ const e=el('div','empty'); e.style.width=e.style.height=big+'px'; slot.append(el('div','',`<div style="color:#fff;font-size:28px;font-weight:600;height:38px;text-align:center">${n}</div>`),e); }
      else { const t=tokEl(id,big,n); t.style.marginTop='38px'; draggable(t,{n,id,from:'tray'}); slot.append(t); }
      tray.append(slot);
    });
    for(const s of ['L','R']){
      const n=st.pan[s];
      if(n==null){ sc.fill(s,[]); continue; }
      const id=p.items.find(x=>x[0]===n)[1]; const t=tokEl(id,104*(sc.ts||1),n); t.querySelector('.n').style.top='-34px'; draggable(t,{n,id,from:s}); sc.fill(s,[t]);
    }
    const wL=st.pan.L!=null?W[p.items.find(x=>x[0]===st.pan.L)[1]]:0, wR=st.pan.R!=null?W[p.items.find(x=>x[0]===st.pan.R)[1]]:0;
    sc.setDiff(wR-wL);
    if(st.pan.L!=null && st.pan.R!=null){
      const key=[st.pan.L,st.pan.R].sort().join(',');
      if(key!==st.last){
        st.last=key; st.count++;
        const [a,b]= wL<wR?[st.pan.L,st.pan.R]:[st.pan.R,st.pan.L];
        st.log.push(`${a} &lt; ${b}`);
      }
    } else st.last='';
    document.getElementById('cnt').textContent=st.count;
    if(st.log.length) document.getElementById('log').innerHTML=st.log.map(x=>`<span>${x}</span>`).join('');
  }
  dropHandler=(pl,to)=>{
    if(pl.from===to) return;
    if(pl.from==='L'||pl.from==='R') st.pan[pl.from]=null;
    if(to==='L'||to==='R'){ st.pan[to]=pl.n; }
    render();
  };
  render();
}

/* ---------- 유형 2: 작은 추로 무게 차이 찾기 ---------- */
function rSteps(p){
  const root=frame(p);
  if(p.stage===2) Object.assign(root.querySelector('.qtext').style,{left:'280px',right:'280px',top:'22px',lineHeight:'1.3'});
  if(p.stage!==2){ Object.assign(root.querySelector('.qtext').style,{top:'24px',left:'230px',right:'230px',fontSize:'31px',lineHeight:'1.3'}); root.querySelector('.qtext .sub').style.fontSize='25px'; }
  const st={k:0, L:[], R:[], found:[]};
  const chain=el('div','chain'); chain.style.cssText=`left:0;right:0;top:${p.stage===2?262:196}px`; root.append(chain);
  const sc=p.stage===2? new ImgScale(root,{x:120,y:440,w:660,cfg:S1}) : new Scale(root,{x:120,y:330,w:760,h:520,half:270,str:180,panW:240});
  dropTarget(sc.pans.L.el,'L'); dropTarget(sc.pans.R.el,'R');
  const box=el('div','panel droptray'); box.style.cssText=`left:960px;top:${p.stage===2?400:360}px;width:560px;height:250px`; dropTarget(box,'tray');
  box.innerHTML='<h4>작은 추</h4>';
  const tray=el('div'); tray.style.cssText='display:flex;gap:46px;justify-content:center;align-items:flex-end;height:170px'; box.append(tray); root.append(box);
  const msg=el('div','msg'); msg.style.cssText=`left:930px;top:${p.stage===2?672:640}px;width:620px;font-size:23px`; root.append(msg);
  const nextBtn=el('button','btn','다음 비교 ▶'); const resetBtn=el('button','btn white sm','↺ 다시 하기');
  const bb=el('div'); bb.style.cssText='position:absolute;left:350px;top:828px;display:flex;gap:16px;z-index:9'; bb.append(resetBtn); root.append(bb);
  navButtons(root,p,[nextBtn]);
  resetBtn.onclick=()=>{ st.L=[]; st.R=[]; render(); };
  nextBtn.onclick=()=>{ if(st.k<p.pairs.length-1){ st.k++; st.L=[]; st.R=[]; render(); } else success(p,'추들은 10g씩 차이가 납니다!'); };
  function drawChain(){
    chain.innerHTML='';
    const [a,b]=p.pairs[st.k];
    ORDER.forEach((id,i)=>{
      if(i>0){ const f=st.found.includes(i); chain.append(el('div','arr'+(f?' found':''),`<b>${f?'+10g':'?g'}</b><i>›</i>`)); }
      const c=el('div','c'); c.innerHTML=`<div class="n">${N2[id]}</div>`;
      const t=tokEl(id,86); t.classList.add('locked'); if(id===a||id===b) t.classList.add('cur');
      c.append(t); c.style.opacity = (i<=st.k+1)?1:.45; chain.append(c);
    });
  }
  function render(){
    const [a,b]=p.pairs[st.k];
    const solved = st.found.includes(st.k+1);
    const mk=(id,s)=>{ const t=tokEl(id,s,N2[id]); t.classList.add('locked'); t.querySelector('.n').style.top='-34px'; return t; };
    const L=[mk(a,110*(sc.ts||1))], R=[mk(b,110*(sc.ts||1))];
    st.L.forEach(id=>{ const t=tokEl(id,74*(sc.ts||1)); if(!solved) draggable(t,{id,from:'L'}); L.push(t); });
    st.R.forEach(id=>{ const t=tokEl(id,74*(sc.ts||1)); if(!solved) draggable(t,{id,from:'R'}); R.push(t); });
    sc.fill('L',L); sc.fill('R',R);
    tray.innerHTML='';
    ['s10','s5','s1'].forEach(id=>{
      if(st.L.includes(id)||st.R.includes(id)){ const e=el('div'); e.style.width='90px'; tray.append(e); return; }
      const t=tokEl(id,96); if(!solved) draggable(t,{id,from:'tray'}); tray.append(t);
    });
    const d=(W[b]+sum(st.R))-(W[a]+sum(st.L));
    sc.setDiff(d);
    nextBtn.classList.toggle('hidden',!solved);
    nextBtn.textContent = st.k<p.pairs.length-1?'다음 비교 ▶':'결과 보기 ▶';
    resetBtn.classList.toggle('hidden',solved);
    msg.classList.toggle('good',solved);
    if(solved) msg.innerHTML=`정답! <b>${N2[b]}번</b> 추는 <b>${N2[a]}번</b> 추보다 <b>10g</b> 더 무거워요.`;
    else if(!st.L.length && !st.R.length) msg.innerHTML=`<b>${N2[a]}번</b>과 <b>${N2[b]}번</b> 추를 비교했더니 오른쪽으로 기울었어요.<br>작은 추를 끌어서(또는 눌러서) 접시에 올려 보세요.`;
    else if(d>0 && sum(st.R)>0 && sum(st.L)===0) msg.innerHTML='저울이 더 기울어졌어요!<br>작은 추는 <b>가벼운 쪽</b>에 올려야 해요.';
    else if(d>0) msg.innerHTML='조금 덜 기울었지만 아직 오른쪽이 무거워요.<br>다른 작은 추로 바꿔 볼까요?';
    else if(d<0) msg.innerHTML='이번엔 왼쪽이 더 무거워졌어요.<br>작은 추를 바꿔 볼까요?';
    drawChain();
    if(solved) return true;
  }
  dropHandler=(pl,to)=>{
    if(pl.from===to) return;
    if(pl.from==='L') st.L=st.L.filter(x=>x!==pl.id);
    if(pl.from==='R') st.R=st.R.filter(x=>x!==pl.id);
    if(to==='L') st.L.push(pl.id); if(to==='R') st.R.push(pl.id);
    const [a,b]=p.pairs[st.k];
    if(W[a]+sum(st.L)===W[b]+sum(st.R)){ st.found.push(st.k+1); play('right'); }
    render();
  };
  render();
}

    st.revealed=true; render();

    else setTimeout(()=>wrong(p, d>0?'저울이 <b>오른쪽</b>으로 기울었어요.':'저울이 <b>왼쪽</b>으로 기울었어요.'),1300);

    const o={key:pl.key,id:pl.id};
    if(pl.from==='L'||pl.from==='R') st[pl.from]=st[pl.from].filter(x=>x.key!==pl.key);
    if(to==='L'||to==='R') st[to].push(o);

  render();
}

/* 저울2(수평)·저울3(기울어짐) 그림을 바꿔 보여 주는 저울 */
class PicScale{
  constructor(parent,{x,y,w}){
    const k=this.k=w/885; this.ts=.66;
    const r=this.root=el('div','iscale pscale'); r.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${591*k}px`;
    const mk=(src,css)=>{ const i=el('img'); i.src=IMG(src); i.style.cssText='position:absolute;transition:opacity .5s;'+css; r.append(i); return i; };
    this.lv=mk('s2_full','left:0;top:0;width:100%');
    this.tR=mk('s3',`left:${2*k}px;top:${-8*k}px;width:${898*k}px;opacity:0`);
    this.tL=mk('s3',`left:${-22*k}px;top:${-8*k}px;width:${898*k}px;opacity:0;transform:scaleX(-1)`);
    this.pos={0:{L:[115,347],R:[765,347]}, 1:{L:[125,314],R:[774,424]}, '-1':{L:[104,424],R:[753,314]}};
    this.pans={};
    for(const s of ['L','R']){
      const h=el('div','hang pzone'); h.style.cssText=`width:${260*k}px;height:${300*k}px;transition:left .5s,top .5s`;
      const it=el('div','items pitems'); h.append(it); r.append(h); this.pans[s]={el:h,items:it};
    }
    this.h=this.pans; this.cx=w/2; this.py=100; parent.append(r); this.set(0);
  }
  set(deg){
    const st=deg===0?0:(deg>0?1:-1), k=this.k;
    this.lv.style.opacity=st===0?1:0; this.tR.style.opacity=st===1?1:0; this.tL.style.opacity=st===-1?1:0;
    for(const s of ['L','R']){ const [px,py]=this.pos[st][s]; const e=this.pans[s].el; e.style.left=(px-130)*k+'px'; e.style.top=(py-300)*k+'px'; }
  }
  setDiff(d){ this.set(d===0?0:Math.sign(d)); }
  fill(side,nodes){ const it=this.pans[side].items; it.innerHTML=''; nodes.forEach(n=>it.append(n)); }
}
/* 그림 저울 (저울2.png를 받침대·저울대·가운데·양쪽 접시로 나눔) */
const S2={W:885,H:591,P:[440,183],anc:{L:[115,190],R:[765,190]},hang:{L:['s2_hl',0,182,263,313],R:['s2_hr',618,182,267,313]},itemY:347,beam:'s2_beam',center:null,stand:'s2_stand'};
const S1={W:867,H:406,P:[433,189],anc:{L:[118,178],R:[747,178]},hang:{L:['s1_hl',0,160,269,246],R:['s1_hr',598,160,269,246]},itemY:340,beam:'s1_beam',center:null,stand:null};
class ImgScale{
  constructor(parent,{x,y,w,cfg=S2}){
    const c=this.c=cfg, k=this.k=w/c.W;
    const r=this.root=el('div','iscale'); r.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${c.H*k}px`;
    if(c.stand){ const st=el('img'); st.src=IMG(c.stand); r.append(st); }
    this.h={};
    for(const s of ['L','R']){
      const [src,ox,oy,cw,ch]=c.hang[s];
      const h=el('div','hang'); h.style.cssText=`left:${ox*k}px;top:${oy*k}px;width:${cw*k}px;height:${ch*k}px`;
      h.innerHTML=`<img src="${IMG(src)}" alt="">`;
      const it=el('div','items'); it.style.cssText=`left:${(c.anc[s][0]-ox)*k-200}px;width:400px;bottom:${(oy+ch-c.itemY)*k}px`;
      h.append(it); r.append(h); this.h[s]={el:h,items:it};
    }
    this.beam=el('img','beamimg'); this.beam.src=IMG(c.beam); this.beam.style.transformOrigin=`${c.P[0]*k}px ${c.P[1]*k}px`;
    this.pans={L:this.h.L,R:this.h.R}; this.cx=w/2; this.py=c.P[1]*k; this.ts=.8;
    r.append(this.beam); if(c.center){ const ce=el('img'); ce.src=IMG(c.center); r.append(ce); } parent.append(r); this.set(0);
  }
  set(deg){
    const k=this.k, rad=deg*Math.PI/180, [px,py]=this.c.P;
    this.beam.style.transform=`rotate(${deg}deg)`;
    for(const s of ['L','R']){
      const [ax,ay]=this.c.anc[s], dx=ax-px, dy=ay-py;
      const nx=px+dx*Math.cos(rad)-dy*Math.sin(rad), ny=py+dx*Math.sin(rad)+dy*Math.cos(rad);
      this.h[s].el.style.transform=`translate(${(nx-ax)*k}px,${(ny-ay)*k}px)`;
    }
  }
  setDiff(d){ this.set(d===0?0:Math.sign(d)*Math.min(11,4+Math.abs(d)*.3)); }
  fill(side,nodes){ const it=this.h[side].items; it.innerHTML=''; nodes.forEach(n=>it.append(n)); }
}

(function () {
  function loadImg(src) {
    return new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  }
  // 화면 인증서와 같은 기울어진 저울 그림 (흑백 영수증용으로 회색조)
  async function scalePicture() {
    const Wd = 600, Ht = 400, c = document.createElement("canvas");
    c.width = Wd; c.height = Ht;
    const x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, Wd, Ht);
    const [sc, w1, w2] = await Promise.all([IMG("s3"), IMG("w_poke"), IMG("w_super")].map(loadImg));
    const k = Wd / 898;
    x.filter = "grayscale(1) contrast(1.25)";
    if (sc) x.drawImage(sc, 0, 0, Wd, 599 * k);
    const sz = 100 * k * 1.15;
    [[w1, 123, 322], [w2, 772, 432]].forEach(([im, cx, by]) => { if (im) x.drawImage(im, cx * k - sz / 2, by * k - sz, sz, sz); });
    return c.toDataURL("image/png");
  }
  function esc(t) { return String(t).replace(/[&<>]/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[s])); }

  window.printCert = async function () {
    const stage = (typeof doneStage !== "undefined") ? doneStage : 1;
    const info = (STAGES[stage] || {}).title || "";
    const msg = (DONE_MSG[stage] || "");
    const d = new Date(), pad = n => String(n).padStart(2, "0");
    let pic = "";
    try { pic = await scalePicture(); } catch (e) {}
    document.getElementById("receipt").innerHTML =
      '<div class="r-top">' + esc(RECEIPT.top) + '</div>' +
      '<div class="r-title">' + stage + '단계 성공!</div>' +
      '<div class="r-sub">' + esc(RECEIPT.sub) + '</div><hr>' +
      (pic ? '<img src="' + pic + '" alt="">' : '') +
      '<div class="r-stage">' + stage + '단계 · ' + esc(info) + '</div>' +
      '<div class="r-msg">' + msg + '</div>' +
      (RECEIPT.nameLine ? '<div class="r-name">' + esc(RECEIPT.nameLine) + '</div>' : '') +
      '<hr><div class="r-big">' + esc(RECEIPT.big) + '</div>' +
      '<div class="r-date">' + d.getFullYear() + '.' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + '</div>';
    await new Promise(r => setTimeout(r, 150));   // 그림이 자리 잡을 시간
    window.print();
  };
})();
</script>
</body>
</html>
